name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: iprviamao-169920
  SERVICE_NAME: lampada-iprviamao-com-br
  REGION: us-central1
  AR_REPO_NAME: cloud-run-source-deploy
  CLOUD_SQL_INSTANCE: iprviamao-169920:us-central1:app-e-ticket
  APP_ENV: production

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Build Docker Image
        run: docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .
            
      - name: Push Docker Image
        run: docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}  

      - name: Deploy to Cloud Run
        id: deploy
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: | 
            --cpu=1 
            --memory=512Mi
            --concurrency=80
            --add-cloudsql-instances ${{ env.CLOUD_SQL_INSTANCE }}
            --allow-unauthenticated
          env_vars: |
            APP_NAME=${{ env.SERVICE_NAME }},
            APP_ENV=${{ env.APP_ENV }},
            APP_DEBUG=true,
            APP_LOCALE=pt_BR,
            DB_CONNECTION=mysql,
            DB_SOCKET=/cloudsql/${{ env.CLOUD_SQL_INSTANCE }},
            DB_DATABASE=${{ secrets.CLOUD_SQL_DATABASE }},
            DB_USERNAME=${{ secrets.CLOUD_SQL_USER}},
            DB_PASSWORD=${{ secrets.CLOUD_SQL_PASSWORD}},
            APP_VERSION=${{ github.sha }},
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Exibir URL do Cloud Run
        run: echo "'Service URL:' ${{ steps.deploy.outputs.url }}"