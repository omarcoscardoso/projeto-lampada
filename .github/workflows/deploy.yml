name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  AR_REPO_NAME: ${{ vars.AR_REPO_NAME }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev

      - name: Build Docker Image
        run: docker build -t ${{ vars.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO_NAME }}/${{ vars.SERVICE_NAME }}:${{ github.sha }} .
            
      - name: Push Docker Image
        run: docker push ${{ vars.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO_NAME }}/${{ vars.SERVICE_NAME }}:${{ github.sha }}  

      - name: Deploy to Cloud Run
        id: deploy
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ vars.SERVICE_NAME }}
          region: ${{ vars.REGION }}
          image: ${{ vars.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO_NAME }}/${{ vars.SERVICE_NAME }}:${{ github.sha }}
          flags: | 
            --cpu=1 
            --memory=512Mi
            --concurrency=80
            --add-cloudsql-instances ${{ vars.CLOUD_SQL_INSTANCE }}
            --allow-unauthenticated
          env_vars: |
            APP_NAME=${{ vars.SERVICE_NAME }},
            APP_ENV=${{ vars.APP_ENV }},
            APP_URL=${{ vars.APP_URL }},
            APP_DEBUG=true,
            APP_LOCALE=pt_BR,
            DB_CONNECTION=mysql,
            DB_SOCKET=/cloudsql/${{ vars.CLOUD_SQL_INSTANCE }},
            DB_DATABASE=${{ vars.DB_DATABASE }},
            DB_USERNAME=${{ vars.DB_USERNAME }},
            DB_PASSWORD=${{ secrets.DB_PASSWORD}},
            APP_VERSION=${{ github.sha }},
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},
            ABIBLIA_DIGITAL_TOKEN=${{ secrets.ABIBLIA_DIGITAL_TOKEN }},
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},
            GOOGLE_REDIRECT_URL=${{ vars.GOOGLE_REDIRECT_URL }},
            GOOGLE_CLOUD_PROJECT_ID=${{ env.PROJECT_ID }},
            GOOGLE_CLOUD_KEY_JSON=${{ secrets.GOOGLE_CLOUD_KEY_JSON }},
            GOOGLE_CLOUD_STORAGE_BUCKET=${{ vars.GOOGLE_CLOUD_STORAGE_BUCKET }},
            GOOGLE_TTS_API_KEY=${{ secrets.GOOGLE_TTS_API_KEY }}
      - name: Exibir URL do Cloud Run
        run: echo "'Service URL:' ${{ steps.deploy.outputs.url }}"